name: Portfolio CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: "true"
      PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked development dependencies
        run: npm ci
      - name: Check repository and release invariants
        run: npm run check
      - name: Test deployment verification
        run: npm run test:release
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Test browsers, accessibility, and mobile behavior
        run: npm run test:ci
      - name: Run Lighthouse against a dedicated local preview
        run: npm run audit:preview
      - name: Ensure verification did not modify release sources
        run: git diff --exit-code -- index.html assets/ package-lock.json
      - name: Package and verify the Hostinger upload
        if: runner.os == 'Windows'
        run: npm run package:hostinger
      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-reports-${{ matrix.os }}
          path: |
            reports/playwright/
            reports/lighthouse.report.*
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Hostinger package
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-hostinger
          path: output/portfolio-hostinger.zip
          if-no-files-found: error
          retention-days: 14
