name: Portfolio CI

on:
  push:
    branches:
      - master
      - "portfolio/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate static portfolio and Pages contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml')"

      - name: Serve site and verify public assets
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/index.html > /tmp/index.html; then
              break
            fi
            sleep 0.5
          done

          grep -q "Data Engineer & Data Analyst" /tmp/index.html
          curl --fail --silent --show-error http://127.0.0.1:8000/style.css > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/robots.txt > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/sitemap.xml > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/profile_photo_optimized.jpg > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/Aarya_Mody_Resume.pdf > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/404.html | grep -q "This page is not in the data map"
          curl --fail --silent --show-error http://127.0.0.1:8000/.nojekyll > /dev/null
