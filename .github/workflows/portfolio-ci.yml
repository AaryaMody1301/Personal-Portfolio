name: Portfolio CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: "true"
      PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked development dependencies
        run: npm ci
      - name: Build locally bundled runtime assets
        run: npm run build
      - name: Upload reproducible runtime build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-runtime-${{ matrix.os }}
          path: |
            index.html
            projects/*.html
            assets/
          if-no-files-found: error
          retention-days: 14
      - name: Check repository and release invariants
        run: npm run check
      - name: Test deployment verification
        run: npm run test:release
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Capture design review previews
        run: npx playwright test --grep "capture cobalt" --project desktop --project mobile
      - name: Upload design review previews
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-design-${{ matrix.os }}
          path: reports/local/**/cobalt-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Test static case studies and accessibility
        run: npx playwright test tests/case-studies.spec.js --grep-invert "capture cobalt" --max-failures=4
      - name: Verify World loading and keyboard regressions
        run: |
          npx playwright test tests/world.spec.js --grep "scene readiness never dismisses|all Work disclosures|destination labels stay separated|hidden introduction never receives|paused World becomes idle" --project desktop --project mobile --max-failures=1
          npx playwright test tests/world.spec.js --grep "resize and orientation changes" --project iphone --project iphone-small --project ipad --max-failures=1
      - name: Run Lighthouse against a dedicated local preview
        id: lighthouse
        continue-on-error: true
        run: npm run audit:preview
      - name: Test portfolio navigation, accessibility, and mobile behavior
        run: npx playwright test tests/world.spec.js --grep-invert "visual baseline" --max-failures=4
      - name: Install Windows Chrome for reviewed visual references
        if: runner.os == 'Windows'
        run: npx playwright install chrome
      - name: Verify reviewed Windows Chrome visual references
        if: runner.os == 'Windows'
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: npx playwright test --grep "visual baseline" --project desktop --project mobile
      - name: Ensure verification did not modify release sources
        run: git diff --exit-code -- index.html projects/ assets/ site-pages.json package-lock.json
      - name: Require Lighthouse acceptance
        if: ${{ !cancelled() && steps.lighthouse.outcome == 'failure' }}
        run: node -e "console.error('Lighthouse acceptance failed; see the saved reports.'); process.exit(1)"
      - name: Package and verify the Hostinger upload
        if: runner.os == 'Windows'
        run: npm run package:hostinger
      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-reports-${{ matrix.os }}
          path: |
            reports/local/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Hostinger package
        if: success() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-hostinger
          path: output/portfolio-hostinger.zip
          if-no-files-found: error
          retention-days: 14
