<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Video Game Sales Dashboard — source-derived conceptual analysis workflow</title>
  <desc id="desc">A conceptual workflow showing reported cumulative lifetime game sales grouped by release cohort, interactive filtering by platform, region, genre, publisher, score, and release year, comparable visual analysis, and export of the filtered dataset to CSV or Excel. Release-cohort lifetime sales are not transaction-period sales. This is not a product screenshot.</desc>
  <metadata>Source: https://github.com/AaryaMody1301/Video-Game-Sales-Dashboard/blob/master/README.md ; reviewed 2026-10-24. Original portfolio illustration; no dataset records are reproduced.</metadata>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" stroke="#244B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="640" rx="20" fill="#E8EEE6"/>
  <path d="M48 80h864" stroke="#244B3B" stroke-opacity=".16"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#244B3B">
    <text x="48" y="50" font-size="16" letter-spacing="2">GAME SALES / SOURCE-DERIVED CONCEPTUAL WORKFLOW</text>
    <text x="48" y="143" font-family="Georgia, serif" font-size="46" letter-spacing="-1.5">A clearer view of the dataset.</text>
    <text x="48" y="181" fill="#5C655E" font-size="21">Ask a question. Keep the context. Export the evidence.</text>
    <g fill="#F7F5EF" stroke="#244B3B" stroke-opacity=".19"><rect x="48" y="238" width="280" height="274" rx="12"/><rect x="376" y="238" width="248" height="274" rx="12"/><rect x="672" y="238" width="240" height="155" rx="12"/><rect x="672" y="425" width="240" height="87" rx="12" fill="#244B3B"/></g>
    <g fill="none" stroke="#244B3B" stroke-width="1.5" marker-end="url(#arrow)"><path d="M328 326h40"/><path d="M624 326h40"/><path d="M792 393v24"/></g>
    <g font-size="15" letter-spacing="1.6" fill="#5C655E"><text x="72" y="271">01 / UNDERSTAND</text><text x="400" y="271">02 / FILTER</text><text x="696" y="271">03 / COMPARE</text></g>
    <g font-size="24" fill="#202A24"><text x="72" y="312">Reported lifetime</text><text x="72" y="343">sales + release dates</text><text x="400" y="312">A focused subset</text><text x="696" y="312">Visual analysis</text></g>
    <g font-size="19" fill="#5C655E">
      <text x="72" y="395">Group by release cohort.</text><text x="72" y="426">Keep cumulative-sales</text><text x="72" y="457">semantics visible.</text>
      <text x="400" y="357">Platform · region</text><text x="400" y="392">Genre · publisher</text><text x="400" y="427">Score · release year</text><text x="400" y="475" font-size="17">Same-title release identities</text>
      <text x="696" y="348">Patterns + comparisons</text><text x="696" y="376">Exploratory forecasting</text>
    </g>
    <text x="696" y="460" font-size="24" fill="#F7F5EF">CSV / Excel</text><text x="696" y="491" font-size="18" fill="#E8EEE6">Export the filtered dataset</text>
    <path d="M48 564h864" stroke="#244B3B" stroke-opacity=".16"/>
    <circle cx="56" cy="599" r="5" fill="#244B3B"/>
    <text x="74" y="605" font-size="18" fill="#5C655E">Lifetime sales by release cohort are not sales occurring in that period.</text>
  </g>
</svg>
