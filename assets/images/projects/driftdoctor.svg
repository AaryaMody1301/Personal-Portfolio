<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">DriftDoctor — source-derived conceptual repair workflow</title>
  <desc id="desc">An incident and local dbt evidence lead to contract diagnosis, a guarded existing-file repair or abstention, executable checks, and a human-reviewed diff and report. This conceptual diagram is derived from the DriftDoctor README, not a product screenshot. Synthetic benchmark results do not establish production repair coverage.</desc>
  <metadata>Source: https://github.com/AaryaMody1301/DriftDoctor/blob/main/README.md ; reviewed 2026-10-24. Original portfolio illustration.</metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 4 3-4 3" stroke="#244B3B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="960" height="640" rx="20" fill="#E8EEE6"/>
  <path d="M48 80h864" stroke="#244B3B" stroke-opacity=".16"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#244B3B">
    <text x="48" y="50" font-size="16" letter-spacing="2">DRIFTDOCTOR / SOURCE-DERIVED CONCEPTUAL WORKFLOW</text>
    <text x="48" y="143" font-family="Georgia, serif" font-size="46" letter-spacing="-1.5">A repair you can review.</text>
    <text x="48" y="181" fill="#5C655E" font-size="21">Local evidence. Bounded decisions. A human in control.</text>
    <g stroke="#244B3B" stroke-opacity=".19" fill="#F7F5EF">
      <rect x="48" y="232" width="256" height="124" rx="12"/>
      <rect x="352" y="232" width="256" height="124" rx="12"/>
      <rect x="656" y="232" width="256" height="124" rx="12"/>
      <rect x="48" y="420" width="256" height="104" rx="12" fill="none" stroke-dasharray="5 5"/>
      <rect x="352" y="420" width="256" height="104" rx="12"/>
      <rect x="656" y="420" width="256" height="104" rx="12" fill="#244B3B"/>
    </g>
    <g fill="none" stroke="#244B3B" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M304 294h40"/>
      <path d="M608 294h40"/>
      <path d="M784 356v28H480v28"/>
      <path d="M608 472h40"/>
      <path d="M480 356v28H176v28" stroke-dasharray="4 5"/>
    </g>
    <g font-size="15" letter-spacing="1.6" fill="#5C655E">
      <text x="72" y="264">01 / OBSERVE</text><text x="376" y="264">02 / DIAGNOSE</text><text x="680" y="264">03 / REPAIR</text>
    </g>
    <g font-size="24" fill="#202A24">
      <text x="72" y="301">Incident + evidence</text><text x="376" y="301">Visible contract</text><text x="680" y="301">Guarded local edit</text>
      <text x="72" y="457">Abstain / escalate</text><text x="376" y="457">Executable checks</text>
    </g>
    <g font-size="18" fill="#5C655E">
      <text x="72" y="330">dbt, SQL, business rules</text><text x="376" y="330">Skills first; bounded agent</text><text x="680" y="330">Existing files; sandbox only</text>
      <text x="72" y="489">When no safe repair verifies</text><text x="376" y="489">dbt + contract validation</text>
    </g>
    <text x="680" y="457" font-size="24" fill="#F7F5EF">Human review</text>
    <text x="680" y="489" font-size="18" fill="#E8EEE6">Approval-ready diff + report</text>
    <path d="M48 564h864" stroke="#244B3B" stroke-opacity=".16"/>
    <circle cx="56" cy="599" r="5" fill="#244B3B"/>
    <text x="74" y="605" font-size="18" fill="#5C655E">Synthetic evaluation does not establish production repair coverage.</text>
  </g>
</svg>
