    h1 { font-size: clamp(2rem, 7vw, 4rem); margin: .35rem 0 1rem; line-height: 1; }
    a { display: inline-flex; align-items: center; min-height: 44px; margin-top: 12px; padding: 0 18px; border-radius: 999px; background: #79d6c5; color: #07111f; font-weight: 800; text-decoration: none; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
